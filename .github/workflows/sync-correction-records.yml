name: Nodejs sync correction records

on:
  schedule:
    - cron: "30 16 */1 * *"
  workflow_dispatch:
    inputs:
      TABLE_CORECTION_NAME:
        description: "Tên bảng cần kiểm tra"
        required: true
        type: string
        
      FROM:
        description: "Từ ngày (YYYY/MM/DD)"
        required: true
        type: string

      TO:
        description: "Đến ngày (YYYY/MM/DD)"
        required: true
        type: string

jobs:
  # =========================
  # JOB CHÍNH: SYNC CORRECTION
  # =========================
  sync-correction-job:
    name: Sync correction records
    runs-on: ubuntu-latest
    environment: sync-correction

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run sync-correction-records.js
        env:
          DATABASE_SERVICE_KEY: ${{ secrets.DATABASE_SERVICE_KEY }}
          AES_256_CBC_APP_SECRET_KEY: ${{ secrets.AES_256_CBC_APP_SECRET_KEY }}
          LARK_HRM_APP_ID: ${{ secrets.LARK_HRM_APP_ID }}
          LARK_HRM_APP_SECRET: ${{ secrets.LARK_HRM_APP_SECRET }}
          LARK_BASE_ID: ${{ vars.LARK_BASE_ID }}

          TABLE_CORECTION_NAME: ${{ inputs.TABLE_CORECTION_NAME != '' && inputs.TABLE_CORECTION_NAME || vars.TABLE_CORECTION_NAME }}
          FROM: ${{ inputs.FROM != '' && inputs.FROM || vars.FROM }}
          TO: ${{ inputs.TO != '' && inputs.TO || vars.TO }}

        run: node sync-correction-records.js

  # =========================
  # JOB CALLBACK: BẮN WEBHOOK
  # =========================
  callback-job:
    name: Callback result
    needs: sync-correction-job
    if: always()
    runs-on: ubuntu-latest
    environment: sync-correction

    steps:
      - name: Send callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          TABLE_CORECTION_NAME: ${{ inputs.TABLE_CORECTION_NAME != '' && inputs.TABLE_CORECTION_NAME || vars.TABLE_CORECTION_NAME }}
          FROM: ${{ inputs.FROM != '' && inputs.FROM || vars.FROM }}
          TO: ${{ inputs.TO != '' && inputs.TO || vars.TO }}
          CONCLUSION: ${{ needs.sync-correction-job.result }}
        run: |
          jq -n \
            --arg job_id "nodejs-sync-correction-records.yml" \
            --arg conclusion "$CONCLUSION" \
            --arg table_name "$TABLE_CORECTION_NAME" \
            --arg from "$FROM" \
            --arg to "$TO" \
            '{
              job_id: $job_id,
              conclusion: $conclusion,
              table_name: $table_name,
              from: $from,
              to: $to
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-

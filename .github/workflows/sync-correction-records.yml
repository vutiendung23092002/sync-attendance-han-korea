name: Nodejs sync & check correction records

env:
  TZ: Asia/Ho_Chi_Minh

on:
  schedule:
    - cron: "30 14 */1 * *"
  workflow_dispatch:
    inputs:
      TABLE_CORECTION_NAME:
        description: "Tên bảng correction"
        required: true
        type: string
        
      FROM:
        description: "Từ ngày (YYYY/MM/DD)"
        required: true
        type: string

      TO:
        description: "Đến ngày (YYYY/MM/DD)"
        required: true
        type: string

jobs:
  # =========================
  # JOB 1: SYNC CORRECTION
  # =========================
  sync-correction-job:
    name: Sync correction records
    runs-on: ubuntu-latest
    environment: sync-correction

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --only=production

      - name: Run sync-correction-records.js
        env:
          DATABASE_SERVICE_KEY: ${{ secrets.DATABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AES_256_CBC_APP_SECRET_KEY: ${{ secrets.AES_256_CBC_APP_SECRET_KEY }}
          LARK_HRM_APP_ID: ${{ secrets.LARK_HRM_APP_ID }}
          LARK_HRM_APP_SECRET: ${{ secrets.LARK_HRM_APP_SECRET }}
          LARK_BASE_ID: ${{ vars.LARK_BASE_ID }}

          TABLE_CORECTION_NAME: ${{ inputs.TABLE_CORECTION_NAME != '' && inputs.TABLE_CORECTION_NAME || vars.TABLE_CORECTION_NAME }}
          FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.FROM || '' }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.TO || '' }}

        run: node sync-correction-records.js

  # =========================
  # JOB 2: CALLBACK
  # =========================
  callback-job:
    name: Callback result
    needs: sync-correction-job
    if: always()
    runs-on: ubuntu-latest
    environment: sync-correction

    outputs:
      conclusion: ${{ needs.sync-correction-job.result }}

    steps:
      - name: Send callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          TABLE_CORECTION_NAME: ${{ inputs.TABLE_CORECTION_NAME != '' && inputs.TABLE_CORECTION_NAME || vars.TABLE_CORECTION_NAME }}
          FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.FROM || '' }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.TO || '' }}
          CONCLUSION: ${{ needs.sync-correction-job.result }}
        run: |
          jq -n \
            --arg job_id "nodejs-sync-correction-records.yml" \
            --arg conclusion "$CONCLUSION" \
            --arg table_name "$TABLE_CORECTION_NAME" \
            --arg from "$FROM" \
            --arg to "$TO" \
            '{
              job_id: $job_id,
              conclusion: $conclusion,
              table_name: $table_name,
              from: $from,
              to: $to
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-

  # =========================
  # JOB 3: CHECK STATUS
  # =========================
  check-correction-status-job:
    name: Check correction status
    needs: callback-job
    runs-on: ubuntu-latest
    environment: check-corection

    #  CHỈ chạy khi sync thành công:
    if: needs.callback-job.outputs.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --only=production

      - name: Run check-correction-status.js
        env:
          LARK_HRM_APP_ID: ${{ secrets.LARK_HRM_APP_ID }}
          LARK_HRM_APP_SECRET: ${{ secrets.LARK_HRM_APP_SECRET }}
          LARK_BASE_ID: ${{ vars.LARK_BASE_ID }}
          TABLE_ATTENDANCE_ID: ${{ vars.TABLE_ATTENDANCE_ID }}
          TABLE_CORECTION_ID: ${{ vars.TABLE_CORECTION_ID }}

          FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.FROM || '' }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.TO || '' }}

        run: node check-correction-status.js

          # =========================
  # JOB 4: CALLBACK STATUS
  # =========================
  callback-status-job:
    name: Callback check status result
    needs: check-correction-status-job
    if: always()
    runs-on: ubuntu-latest
    environment: check-corection

    steps:
      - name: Send status callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}

          FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.FROM || '' }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.TO || '' }}

          CONCLUSION: ${{ needs.check-correction-status-job.result }}
        run: |
          jq -n \
            --arg job_id "nodejs-check-correction-status.yml" \
            --arg conclusion "$CONCLUSION" \
            --arg from "$FROM" \
            --arg to "$TO" \
            '{
              job_id: $job_id,
              conclusion: $conclusion,
              from: $from,
              to: $to
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-

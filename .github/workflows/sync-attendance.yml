name: Nodejs sync attendance

env:
  TZ: Asia/Ho_Chi_Minh

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      TABLE_NAME_ATTENDANCE:
        description: "Tên bảng cần kiểm tra"
        required: true
        type: string
        
      FROM:
        description: "Từ ngày (YYYY/MM/DD)"
        required: true
        type: string

      TO:
        description: "Đến ngày (YYYY/MM/DD)"
        required: true
        type: string

jobs:
  # =========================
  # JOB CHÍNH: SYNC ATTENDANCE
  # =========================
  sync-attendance-job:
    name: Sync attendance
    runs-on: ubuntu-latest
    environment: sync-attendance

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run sync-attendance.js
        env:
          DATABASE_SERVICE_KEY: ${{ secrets.DATABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AES_256_CBC_APP_SECRET_KEY: ${{ secrets.AES_256_CBC_APP_SECRET_KEY }}
          LARK_HRM_APP_ID: ${{ secrets.LARK_HRM_APP_ID }}
          LARK_HRM_APP_SECRET: ${{ secrets.LARK_HRM_APP_SECRET }}
          LARK_BASE_ID: ${{ vars.LARK_BASE_ID }}

          TABLE_NAME_ATTENDANCE: ${{ inputs.TABLE_NAME_ATTENDANCE != '' && inputs.TABLE_NAME_ATTENDANCE || vars.TABLE_NAME_ATTENDANCE }}
          FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.FROM || '' }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.TO || '' }}

        run: node sync-attendance.js

  # =========================
  # JOB CALLBACK: BẮN WEBHOOK
  # =========================
  callback-job:
    name: Callback result
    needs: sync-attendance-job
    if: always()
    runs-on: ubuntu-latest
    environment: sync-attendance

    steps:
      - name: Send callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          TABLE_NAME_ATTENDANCE: ${{ inputs.TABLE_NAME_ATTENDANCE != '' && inputs.TABLE_NAME_ATTENDANCE || vars.TABLE_NAME_ATTENDANCE }}
          FROM: ${{ github.event_name == 'workflow_dispatch' && inputs.FROM || '' }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.TO || '' }}
          CONCLUSION: ${{ needs.sync-attendance-job.result }}
        run: |
          jq -n \
            --arg job_id "nodejs-sync-attendance.yml" \
            --arg conclusion "$CONCLUSION" \
            --arg table_name "$TABLE_NAME_ATTENDANCE" \
            --arg from "$FROM" \
            --arg to "$TO" \
            '{
              job_id: $job_id,
              conclusion: $conclusion,
              table_name: $table_name,
              from: $from,
              to: $to
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-

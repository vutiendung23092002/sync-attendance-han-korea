name: Nodejs sync-leave-instances

on:
  schedule:
    - cron: "30 14 */1 * *"
  workflow_dispatch:
    inputs:
      TABLE_INSTANCES_NAME:
        description: "Tên bảng phép"
        required: true
        type: string
        
      FROM:
        description: "Từ ngày (YYYY/MM/DD)"
        required: true
        type: string

      TO:
        description: "Đến ngày (YYYY/MM/DD)"
        required: true
        type: string

jobs:
  # =========================
  # JOB 1: SYNC LEAVE
  # =========================
  sync-leave-job:
    name: Sync leave instances
    runs-on: ubuntu-latest
    environment: sync-instances

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run sync-leave-instances.js
        env:
          DATABASE_SERVICE_KEY: ${{ secrets.DATABASE_SERVICE_KEY }}
          AES_256_CBC_APP_SECRET_KEY: ${{ secrets.AES_256_CBC_APP_SECRET_KEY }}
          LARK_HRM_APP_ID: ${{ secrets.LARK_HRM_APP_ID }}
          LARK_HRM_APP_SECRET: ${{ secrets.LARK_HRM_APP_SECRET }}
          LARK_BASE_ID: ${{ vars.LARK_BASE_ID }}

          TABLE_INSTANCES_NAME: ${{ inputs.TABLE_INSTANCES_NAME != '' && inputs.TABLE_INSTANCES_NAME || vars.TABLE_INSTANCES_NAME }}
          FROM: ${{ inputs.FROM != '' && inputs.FROM || vars.FROM }}
          TO: ${{ inputs.TO != '' && inputs.TO || vars.TO }}

        run: node sync-leave-instances.js

  # =========================
  # JOB 2: CALLBACK
  # =========================
  callback-job:
    name: Callback leave sync result
    needs: sync-leave-job
    if: always()
    runs-on: ubuntu-latest
    environment: sync-instances

    steps:
      - name: Send callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}

          TABLE_INSTANCES_NAME: ${{ inputs.TABLE_INSTANCES_NAME != '' && inputs.TABLE_INSTANCES_NAME || vars.TABLE_INSTANCES_NAME }}
          FROM: ${{ inputs.FROM != '' && inputs.FROM || vars.FROM }}
          TO: ${{ inputs.TO != '' && inputs.TO || vars.TO }}

          CONCLUSION: ${{ needs.sync-leave-job.result }}
        run: |
          jq -n \
            --arg job_id "nodejs-sync-leave-instances.yml" \
            --arg conclusion "$CONCLUSION" \
            --arg table_name "$TABLE_INSTANCES_NAME" \
            --arg from "$FROM" \
            --arg to "$TO" \
            '{
              job_id: $job_id,
              conclusion: $conclusion,
              table_name: $table_name,
              from: $from,
              to: $to
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-
